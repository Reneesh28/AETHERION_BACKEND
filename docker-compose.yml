services:
  # ZOOKEEPER

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: zookeeper

    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

    ports:
      - "2181:2181"

    volumes:
      - zookeeper-data:/var/lib/zookeeper/data

    networks:
      - aetherion-network

    restart: unless-stopped

  # KAFKA

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka

    depends_on:
      - zookeeper

    ports:
      - "29092:29092"

    environment:
      KAFKA_BROKER_ID: 1

      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

    volumes:
      - kafka-data:/var/lib/kafka/data

    networks:
      - aetherion-network

    restart: unless-stopped

  # REDIS

  redis:
    image: redis:7-alpine
    container_name: redis

    ports:
      - "6379:6379"

    command: redis-server --appendonly yes

    volumes:
      - redis-data:/data

    networks:
      - aetherion-network

    restart: unless-stopped

  # MYSQL

  mysql:
    image: mysql:8
    container_name: mysql

    ports:
      - "3307:3306"

    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: aetherion
      MYSQL_USER: aetherion_user
      MYSQL_PASSWORD: aetherion_password

    volumes:
      - mysql-data:/var/lib/mysql

    networks:
      - aetherion-network

    restart: unless-stopped

  # MONGODB

  mongodb:
    image: mongo:7
    container_name: mongodb

    ports:
      - "27017:27017"

    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: adminpassword

    volumes:
      - mongodb-data:/data/db

    networks:
      - aetherion-network

    restart: unless-stopped

  # DJANGO CORE

  django_core:
    build:
      context: .
      dockerfile: services/django_core/Dockerfile

    container_name: django_core

    ports:
      - "8000:8000"

    depends_on:
      - kafka
      - redis
      - mysql

    networks:
      - aetherion-network

    restart: unless-stopped

  # INGESTION SERVICE

  ingestion_service:
    build:
      context: .
      dockerfile: services/ingestion_service/Dockerfile

    container_name: ingestion_service

    depends_on:
      - kafka

    networks:
      - aetherion-network

    restart: unless-stopped

  # FEATURE SERVICE

  feature_service:
    build:
      context: .
      dockerfile: services/feature_service/Dockerfile

    container_name: feature_service

    depends_on:
      - kafka
      - redis

    networks:
      - aetherion-network

    restart: unless-stopped

  # ML SERVICES

  ml_regime:
    build:
      context: .
      dockerfile: services/ml_regime/Dockerfile

    container_name: ml_regime

    depends_on:
      - kafka

    networks:
      - aetherion-network

    restart: unless-stopped

  ml_liquidity:
    build:
      context: .
      dockerfile: services/ml_liquidity/Dockerfile

    container_name: ml_liquidity

    depends_on:
      - kafka

    networks:
      - aetherion-network

    restart: unless-stopped

  ml_risk:
    build:
      context: .
      dockerfile: services/ml_risk/Dockerfile

    container_name: ml_risk

    depends_on:
      - kafka

    networks:
      - aetherion-network

    restart: unless-stopped

  ml_anomaly:
    build:
      context: .
      dockerfile: services/ml_anomaly/Dockerfile

    container_name: ml_anomaly

    depends_on:
      - kafka

    networks:
      - aetherion-network

    restart: unless-stopped

  # AGGREGATOR SERVICE

  aggregator_service:
    build:
      context: .
      dockerfile: services/aggregator_service/Dockerfile

    container_name: aggregator_service

    depends_on:
      - kafka
      - redis

    networks:
      - aetherion-network

    restart: unless-stopped

  # DECISION ENGINE

  decision_engine:
    build:
      context: .
      dockerfile: services/decision_engine/Dockerfile

    container_name: decision_engine

    depends_on:
      - kafka
      - redis

    networks:
      - aetherion-network

    restart: unless-stopped

  # SIMULATION SERVICE

  simulation_service:
    build:
      context: .
      dockerfile: services/simulation_service/Dockerfile

    container_name: simulation_service

    depends_on:
      - kafka
      - redis
      - mysql

    networks:
      - aetherion-network

    restart: unless-stopped

# NETWORKS

networks:
  aetherion-network:
    driver: bridge

# VOLUMES

volumes:
  kafka-data:
  redis-data:
  mysql-data:
  mongodb-data:
  zookeeper-data:
